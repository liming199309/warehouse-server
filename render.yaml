# render.yaml - Render 部署配置（Blueprint 模式）
# 使用：Render 控制台 → New → Blueprint → 选这个仓库
services:
  - type: web
    name: mulongshan-warehouse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RENDER
        value: "true"
      - key: UPLOADS_DIR
        value: /tmp/uploads
      # ======== 必填：Neon 数据库连接串 ========
      - key: DATABASE_URL
        sync: false
      # ======== JWT 签名密钥（自动生成） ========
      - key: JWT_SECRET
        generateValue: true
